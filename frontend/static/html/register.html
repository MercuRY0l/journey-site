<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация | Wild Karelia</title>


<body>
<link rel="stylesheet" href="/static/css/register.css">
<script src="/static/js/register.js"></script>
<div class="auth-container wb-theme-content">
  <h2>Регистрация</h2>
  <form id="registerForm">
    <input type="text" name="username" placeholder="Имя" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Пароль" required>
    <input type="password" name="password_repeat" placeholder="Повторите пароль" required>
    <button type="submit" class="wb-theme-button">Зарегистрироваться</button>
</form>
<div class="reg-footer">
  Уже есть аккаунт? <a href="./login">Войти</a>
  </div>
  </div>
</div>
</body>
</html>
