<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторизация</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f8f8f8;
  }
  .auth-container {
    width: 100%;
    max-width: 400px;
    padding: 40px;
    background-color: #fff;
    border: 1px solid #dee2e6;
    box-sizing: border-box;
    border-radius: 0;
    text-align: center;
  }
  .auth-container h2 {
    margin-bottom: 30px;
    color: #212529;
    font-family: Arial;
  }
  .auth-container input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 20px;
    border: 1px solid #dee2e6;
    border-radius: 0;
    box-sizing: border-box;
    font-size: 14px;
  }
  .auth-container button {
    width: 100%;
    padding: 10px;
    border: 1px solid #0d6efd;
    background-color: #0d6efd;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    border-radius: 0;
    font-size: 14px;
  }
  .auth-container button:hover {
    background-color: #0b5ed7;
    border-color: #0a58ca;
  }
  .auth-footer {
    margin-top: 15px;
    font-size: 13px;
  }
  .auth-footer a {
    color: #0d6efd;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="auth-container wb-theme-content">
  <h2>Вход</h2>
  <form>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Пароль" required>
    <button type="submit" class="wb-theme-button">Войти</button>
  </form>
  <div class="auth-footer">
    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
  </div>
</div>
</body>
</html>
